[project]
name = "hrmind-frontend"
version = "0.1.0"
description = "HrMind — Streamlit Frontend"
requires-python = ">=3.11"

dependencies = [
    "streamlit>=1.40.0",
    "httpx[http2]>=0.27.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frontend"]

[tool.uv]
python = "3.11"
