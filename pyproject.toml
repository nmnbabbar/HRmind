[project]
name = "hrmind-backend"
version = "0.1.0"
description = "HrMind — Multi-Agent HR Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # LangChain ecosystem — pinned to 1.x, compatible with LangGraph 0.2+
    "langchain>=1.0.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    # Vector store — HTTP client mode (no file-locking issues with uvicorn)
    "chromadb>=0.6.0",
    # Embeddings + retrieval
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    # Document loading — PDF and DOCX ingestion
    "pypdf>=4.0.0",
    "docx2txt>=0.8",
    # NLP — entity extraction for follow-up resolution
    "spacy>=3.7.0",
    # Async SQLite for SQL agent
    "aiosqlite>=0.20.0",
    # SQL safety — statement-type parser (no regex)
    "sqlglot>=23.0.0",
    # OCR / PDF text extraction
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.0",
    # File safety — magic bytes (not extension)
    # python-magic-bin bundles libmagic.dll on Windows; the plain package needs a system lib
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Settings + validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.5.0",
    # HTTP client (frontend → backend, SSE consumption)
    "httpx[http2]>=0.27.0",
    # Token counting
    "tiktoken>=0.7.0",
    # Structured logging
    "structlog>=24.0.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Pandas — SQL result formatting
    "pandas>=2.2.0",
    # Auth
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.1.0",
    "langsmith[claude-agent-sdk]>=0.10.11",
    "better-profanity>=0.7.0",
]

[project.optional-dependencies]
# Install with: uv sync --extra evals
# Pulls in ragas + its heavy transitive deps (datasets, evaluate, ~500MB)
evals = [
    "ragas>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]

[tool.uv]
# No extra uv config needed — dependencies managed via [dependency-groups] below
